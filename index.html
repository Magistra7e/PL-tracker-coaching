<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showdown Prep Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style id="css">
:root{
  /* Layout: sticky week strip + day switcher, then main lifts and BODi accessories for that day. Phase colors borrow competition plate colors. */
  --bg:#f3f4f6; --surface:#ffffff; --ink:#15181d; --muted:#5d6672; --line:#dde1e7;
  --accent:#c8102e; --accent-ink:#ffffff;
  --p-build:#c8102e; --p-circ:#7a8494; --p-sculpt:#1d4ed8; --p-noexc:#d4a106;
  --ok:#15803d; --field:#f7f8fa;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --surface:#181b21; --ink:#eef0f3; --muted:#9aa3af; --line:#2a2f37;
  --accent:#ff3b4f; --accent-ink:#0f1115; --p-build:#ff3b4f; --p-circ:#9aa3af; --p-sculpt:#5b8cff; --p-noexc:#f2c230;
  --ok:#4ade80; --field:#11141a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#181b21; --ink:#eef0f3; --muted:#9aa3af; --line:#2a2f37;
  --accent:#ff3b4f; --accent-ink:#0f1115; --p-build:#ff3b4f; --p-circ:#9aa3af; --p-sculpt:#5b8cff; --p-noexc:#f2c230;
  --ok:#4ade80; --field:#11141a; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-bottom:10px}
.titlebar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:12px}
h1{font-family:var(--display);font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
.status{font-size:13px;color:var(--muted);white-space:nowrap}
.status.dirty{color:var(--accent);font-weight:600}
.weeks{display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;min-width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--display);font-size:18px;font-weight:700;cursor:pointer;position:relative;border-bottom:4px solid var(--pc)}
.wk[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);border-bottom-color:var(--pc)}
.wk .dots{position:absolute;left:0;right:0;bottom:3px;display:flex;justify-content:center;gap:2px}
.wk .dots i{width:4px;height:4px;border-radius:50%;background:var(--line)}
.wk .dots i.on{background:var(--ok)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.day{border:0;background:transparent;color:var(--muted);font-family:var(--body);font-weight:600;font-size:14px;padding:8px 2px;border-radius:7px;cursor:pointer;line-height:1.15}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.day .chk{display:block;font-size:11px;font-weight:500;opacity:.85}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;gap:14px;padding-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0}
.phase{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--pc) 14%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--pc) 45%,transparent)}
.phase::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.note{border-left:4px solid var(--accent);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:15px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.note b{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;font-size:15px}
.lifts{display:grid;gap:10px}
.lift{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.lift:first-child{border-top:0;padding-top:0}
.lift .nm{font-weight:600}
.lift .meta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.lift .rx{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.lift .log{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.lift .log label{font-size:13px;color:var(--muted)}
.ex{padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0;padding-top:4px}
.ex .nm{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.ex .nm small{color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:8px}
.set{display:grid;gap:3px}
.set label{font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
input.w{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:600 17px var(--body);text-align:center;font-variant-numeric:tabular-nums}
input.w::placeholder{color:var(--muted);opacity:.6;font-weight:500}
.lift input.w{width:96px}
.unit{font-size:13px;color:var(--muted)}
details{font-size:14px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--ink);padding:4px 0}
details p{margin:6px 0 0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 160px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--body);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.empty{color:var(--muted);font-size:15px;margin:0 0 8px}
.vid{grid-column:1/-1;display:grid;gap:8px;margin-top:4px}
.vid video{width:100%;max-height:360px;border-radius:10px;background:#000}
.vrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);cursor:pointer}
.mini.primary{border-color:var(--accent);color:var(--accent)}
.vl{flex:1 1 180px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:15px var(--body);padding:0 10px;min-width:0}
.vlink{font-weight:600;color:var(--accent);text-decoration:none}
.vmsg{margin:0;font-size:14px;color:var(--muted)}
.vmsg.err{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.mini:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.modebar{display:flex;align-items:center;gap:10px;margin-top:8px}
.modebar label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
select#mode{flex:1;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:600 15px var(--body);padding:0 10px}
textarea#restore{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:13px ui-monospace,monospace;padding:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 var a=document.getElementById("wk"+cur.w),strip=root.querySelector(".weeks");if(a&&strip)strip.scrollLeft=Math.max(0,a.offsetLeft-strip.offsetLeft-(strip.clientWidth-a.offsetWidth)/2);
}
function renderStatus(){var el=document.getElementById("status"),b=document.getElementById("save");if(!el)return;
 if(dirty()){el.textContent="Unsaved changes";el.className="status dirty";}
 else{el.textContent=canPublish?"All saved":"Saved on this phone";el.className="status";}
 if(b){b.disabled=!dirty();b.textContent=dirty()?"Save workout":"Saved";}}

/* ---------- lift videos ---------- */
var MAXB=20*1024*1024;
function mb(n){return (n/1048576).toFixed(n<10485760?1:0)+" MB";}
function videoBlock(k,i,lift){var v=state.videos[k],h='<div class="vid" data-vk="'+esc(k)+'">';
 if(ui.busy[k])h+='<p class="vmsg" role="status">'+esc(ui.busy[k])+'</p>';
 else if(v&&v.id)h+='<video controls playsinline preload="metadata" src="/_blob/'+esc(v.id)+'" aria-label="'+esc(lift)+' video"></video><div class="vrow"><span class="sub">Video'+(v.size?" · "+mb(v.size):"")+'</span>'+(assetsNS?'<label class="mini" for="vf'+i+'">Replace</label>':'')+'<button class="mini" data-vact="remove">Remove</button></div>';
 else if(v&&v.link)h+='<div class="vrow"><a class="vlink" href="'+esc(v.link)+'" target="_blank" rel="noopener">▶ Open video</a><button class="mini" data-vact="remove">Remove</button></div>';
 else if(ui.linkFor===k)h+='<div class="vrow"><label class="sr" for="vl'+i+'">Video link</label><input class="vl" id="vl'+i+'" type="url" inputmode="url" placeholder="Paste a link (Drive, iCloud, YouTube)"><button class="mini" data-vact="savelink">Add</button><button class="mini" data-vact="cancel">Cancel</button></div>';
 else if(assetsNS)h+='<div class="vrow"><label class="mini primary" for="vf'+i+'">🎥 Add video</label><span class="sub">Record or pick from your phone</span></div>';
 else if(standalone)h+='<div class="vrow"><button class="mini" data-vact="link">Add a video link</button></div>';
 if(assetsNS)h+='<input class="sr" type="file" accept="video/*" id="vf'+i+'" data-vk="'+esc(k)+'">';
 if(ui.msg[k])h+='<p class="vmsg err" role="alert">'+esc(ui.msg[k])+'</p>';
 return h+'</div>';}
function setVideo(k,v,oldId){var nv=Object.assign({},state.videos);if(v)nv[k]=v;else delete nv[k];
 publish(nv,function(){if(oldId&&assetsNS){assetsNS.delete(oldId).catch(function(){});}});}
function pickMime(){if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return "";
 var c=["video/mp4;codecs=avc1.42E01E","video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
 for(var i=0;i<c.length;i++)if(MediaRecorder.isTypeSupported(c[i]))return c[i];return "";}
/* Re-encode a large phone video smaller in the browser: plays it once (takes as long as the clip) into a canvas and records that. Video only, no sound. */
function shrink(file,onp){return new Promise(function(res,rej){
 var mime=pickMime(),cv=document.createElement("canvas");if(!mime||!cv.captureStream){rej("unsupported");return;}
 var v=document.createElement("video");v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");v.preload="auto";
 v.style.cssText="position:fixed;left:-9999px;top:0;width:2px;height:2px";document.body.appendChild(v);
 var url=URL.createObjectURL(file);v.src=url;var done=false;
 function clean(){try{URL.revokeObjectURL(url);v.remove();}catch(e){}}
 v.onerror=function(){if(!done){done=true;clean();rej("decode");}};
 v.onloadedmetadata=function(){var d=v.duration||0,W=v.videoWidth,H=v.videoHeight;if(!d||!W){done=true;clean();rej("decode");return;}
  var long=d>90?640:960,sc=Math.min(1,long/Math.max(W,H));cv.width=Math.round(W*sc/2)*2;cv.height=Math.round(H*sc/2)*2;
  var ctx=cv.getContext("2d"),bps=Math.max(3e5,Math.min(2.5e6,(MAXB*0.85*8)/d));
  var rec,chunks=[];try{rec=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:bps});}catch(e){done=true;clean();rej("unsupported");return;}
  rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
  rec.onstop=function(){clean();var type=mime.split(";")[0];res(new Blob(chunks,{type:type}));};
  function draw(){if(done)return;ctx.drawImage(v,0,0,cv.width,cv.height);onp(Math.min(99,Math.round(100*v.currentTime/d)));
   if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(draw);else requestAnimationFrame(draw);}
  v.onended=function(){if(done)return;done=true;try{rec.stop();}catch(e){}};
  rec.start(1000);v.play().then(draw).catch(function(){done=true;try{rec.stop();}catch(e){}clean();rej("play");});};
});}
function handleFile(k,file){if(!file||!assetsNS)return;delete ui.msg[k];
 var old=state.videos[k]&&state.videos[k].id;
 var t=(file.type||"").toLowerCase(),isMov=/quicktime/.test(t)||/\.mov$/i.test(file.name||"");
 var up=function(blob,type){ui.busy[k]="Uploading "+mb(blob.size)+"…";render();
  return assetsNS.upload(blob,{type:type}).then(function(r){delete ui.busy[k];setVideo(k,{id:r.id,size:r.sizeBytes,at:new Date().toISOString().slice(0,10)},old);})
  .catch(function(e){delete ui.busy[k];var c=e&&e.code;ui.msg[k]=c==="too_large"?"That video is over the 20 MB limit. Trim it in Photos or paste a link instead.":c==="unsupported_type"?"That video format isn't supported. Paste a link instead.":c==="quota_or_state"?"Video storage is full. Remove an old video or paste a link instead.":"The upload didn't go through. Try again, or paste a link.";render();});};
 if(file.size<=MAXB){up(file,isMov||!t?"video/mp4":(/webm/.test(t)?"video/webm":"video/mp4"));return;}
 ui.busy[k]="This video is "+mb(file.size)+". Shrinking it to fit, keep this page open… 0%";render();
 shrink(file,function(p){ui.busy[k]="Shrinking video, keep this page open… "+p+"%";var el=document.querySelector('.vid[data-vk="'+k+'"] .vmsg');if(el)el.textContent=ui.busy[k];})
 .then(function(b){if(b.size>MAXB||b.size<1000)throw "big";up(b,b.type);})
 .catch(function(){delete ui.busy[k];ui.msg[k]="This video is "+mb(file.size)+" and the limit is 20 MB. It couldn't be shrunk on this phone. Trim it to the lift in Photos, or paste a link instead.";render();});}

/* ---------- events ---------- */
root.addEventListener("click",function(ev){var t=ev.target.closest("button");if(!t)return;
 if(t.dataset.vact){var box=t.closest(".vid"),k=box.dataset.vk,a=t.dataset.vact;delete ui.msg[k];
  if(a==="link"){ui.linkFor=k;render();var inp=document.querySelector('.vid[data-vk="'+k+'"] .vl');if(inp)inp.focus();}
  else if(a==="cancel"){ui.linkFor=null;render();}
  else if(a==="savelink"){var u=(box.querySelector(".vl").value||"").trim();if(!/^https?:\/\/\S+$/i.test(u)){ui.msg[k]="Paste a full link that starts with https://";render();return;}
   ui.linkFor=null;var old=state.videos[k]&&state.videos[k].id;setVideo(k,{link:u,at:new Date().toISOString().slice(0,10)},old);}
  else if(a==="remove"){var o2=state.videos[k]&&state.videos[k].id;setVideo(k,null,o2);}
  return;}
 if(t.dataset.w){cur.w=+t.dataset.w;setHash();render();window.scrollTo(0,0);}
 else if(t.dataset.d){cur.d=t.dataset.d;setHash();render();window.scrollTo(0,0);}
 else if(t.id==="toggle-done"){var k=cur.w+"|"+cur.d;draft.done[k]=!isDone(k);if(!!draft.done[k]===!!state.done[k])delete draft.done[k];saveDraft();render();}
 else if(t.id==="save"){publish();}
 else if(t.id==="copy-backup"){var data=JSON.stringify(merged());var m=document.getElementById("bk-msg");
  try{navigator.clipboard.writeText(data).then(function(){m.textContent="Copied. Paste it somewhere safe.";},function(){showText(data);});}catch(e){showText(data);}}
 else if(t.id==="do-restore"){var m2=document.getElementById("bk-msg");try{var o=JSON.parse(document.getElementById("restore").value);
  if(!o||typeof o.logs!=="object")throw 0;Object.keys(o.logs).forEach(function(k){if(o.logs[k]!==(state.logs[k]||""))draft.logs[k]=o.logs[k];});
  Object.keys(o.done||{}).forEach(function(k){if(!state.done[k])draft.done[k]=true;});saveDraft();
  if(o.videos&&typeof o.videos==="object"){var nv=Object.assign({},state.videos,o.videos);render();publish(nv);}else render();
  var m3=document.getElementById("bk-msg");if(m3)m3.textContent="Restored. Tap Save workout to keep it.";}catch(e){m2.textContent="That doesn't look like a backup. Copy it again and paste the whole thing.";}}
});
function showText(data){var ta=document.getElementById("restore"),m=document.getElementById("bk-msg");ta.value=data;ta.select();m.textContent="Couldn't copy automatically. The backup is in the box. Copy it from there.";}
root.addEventListener("change",function(ev){var ft=ev.target;if(ft.type==="file"&&ft.dataset.vk){handleFile(ft.dataset.vk,ft.files&&ft.files[0]);return;}
 if(ft.id!=="mode")return;cur.mode=ev.target.value;try{localStorage.setItem("sdp-mode",cur.mode);}catch(e){}setHash();render();});
function merged(){var logs=Object.assign({},state.logs),done=Object.assign({},state.done);
 Object.keys(draft.logs).forEach(function(k){if(draft.logs[k])logs[k]=draft.logs[k];else delete logs[k];});
 Object.keys(draft.done).forEach(function(k){if(draft.done[k])done[k]=true;else delete done[k];});return {logs:logs,done:done,videos:Object.assign({},state.videos)};}
root.addEventListener("input",function(ev){var t=ev.target;if(!t.dataset||!t.dataset.k)return;var k=t.dataset.k,v=t.value.trim();
 if(v===(state.logs[k]||""))delete draft.logs[k];else draft.logs[k]=v;saveDraft();renderStatus();});
function setHash(){var h="w"+cur.w+"-"+cur.d.toLowerCase()+(cur.mode==="coach"?"-coach":"");try{history.replaceState(null,"","#"+h);}catch(e){location.hash=h;}}

function publish(nextVideos,after){if(!dirty()&&!nextVideos)return;
 var mm=merged(),logs=mm.logs,done=mm.done,videos=nextVideos||state.videos;
 if(!canPublish||!artifact){
  try{localStorage.setItem(LKEY,JSON.stringify({logs:logs,done:done,videos:videos}));}catch(e){var e1=document.getElementById("status");if(e1){e1.textContent="Couldn't save. Copy a backup.";e1.className="status dirty";}return;}
  state.logs=logs;state.done=done;state.videos=videos;draft={logs:{},done:{}};try{localStorage.removeItem(DKEY);}catch(e){}render();if(after)after();return;}
 var json=JSON.stringify({logs:logs,done:done,videos:videos}).replace(/</g,"\\u003c");
 var css=document.getElementById("css").textContent,app=document.getElementById("app").textContent;
 var head='\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Showdown Prep Tracker</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">\n';
 var SC="scr"+"ipt";
 var doc='<!DOCTYPE html>\n<html lang="en">\n<head>'+head+'<style id="css">'+css+'</style>\n</head>\n<body>\n<div id="root"></div>\n<'+SC+' id="state" type="application/json">'+json+'</'+SC+'>\n<'+SC+' id="app">'+app+'</'+SC+'>\n</body>\n</html>\n';
 var b=document.getElementById("save"),el=document.getElementById("status");if(b){b.disabled=true;b.textContent="Saving…";}if(el)el.textContent="Saving…";
 artifact.publish(doc).then(function(){state.logs=logs;state.done=done;state.videos=videos;draft={logs:{},done:{}};try{localStorage.removeItem(DKEY);}catch(e){}render();if(after)after();})
 .catch(function(err){var m=(err&&(err.code||err.message))||"";if(el){el.textContent=/not_granted|not_writer/.test(m)?"View only":"Couldn't save. Try again.";el.className="status dirty";}if(b){b.disabled=false;b.textContent="Save workout";}});
}
render();
})();
</script>
