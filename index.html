<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showdown Prep Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="auth" hidden></div>
<div id="root"><p class="loading">Loading…</p></div>
<script src="/auth.js"></script>
<script src="/plates.js"></script>
<script>
(function(){
"use strict";
var DAYS=[],WEEKS=0;
var P=null,B=null; /* assigned program and (Showdown only) the BODi swaps, loaded after sign-in */
function dayOf(w,k){var wk=P.weeks[w-1];return (wk&&wk.days&&wk.days[k])||{main:[],acc:[]};}
function phaseFor(w){return w<=5?"build":w===6?"circ":w<=9?"sculpt":"noexc";}
var root=document.getElementById("root");
var me={email:"",isCoach:false};
var state={logs:{},done:{},videos:{}},profile={unit:"lb",maxes:{}};
var draft={logs:{},done:{}},DKEY="sdp-draft-v3";
var cur={w:1,d:"LL",mode:"bodi"};
var ui={busy:{},msg:{},urls:{},att:{},saving:false,saveErr:""};

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-");}
function val(k){return k in draft.logs?draft.logs[k]:(state.logs[k]||"");}
function isDone(k){return k in draft.done?!!draft.done[k]:!!state.done[k];}
function dirty(){return Object.keys(draft.logs).length+Object.keys(draft.done).length>0;}
function saveDraft(){try{localStorage.setItem(DKEY+":"+me.email+":"+P.id,JSON.stringify(draft));}catch(e){}}
function loadDraft(){try{var d=JSON.parse(localStorage.getItem(DKEY+":"+me.email+":"+P.id)||"{}")||{};draft={logs:d.logs||{},done:d.done||{}};}catch(e){draft={logs:{},done:{}};}
 Object.keys(draft.logs).forEach(function(k){if((state.logs[k]||"")===draft.logs[k])delete draft.logs[k];});
 Object.keys(draft.done).forEach(function(k){if(!!state.done[k]===!!draft.done[k])delete draft.done[k];});}
function exList(w,d){if(cur.mode==="coach"||!B)return dayOf(w,d).acc||[];
 var p=B.phases[phaseFor(w)].days[d];if(w===12)return p.map(function(e){return [e[0],e[1].slice(0,2)];});return p;}
function exKey(name){return (cur.mode==="coach"||!B?"c-":"")+slug(name);}
function prevVal(w,d,name,i){var nk=exKey(name);for(var x=w-1;x>=1;x--){var v=val(x+"|"+d+"|"+nk+"|"+i);if(v)return v;}
 for(var y=w-1;y>=1;y--){for(var dd=0;dd<DAYS.length;dd++){var v2=val(y+"|"+DAYS[dd].k+"|"+nk+"|"+i);if(v2)return v2;}}return "";}
function prevMain(w,d,i){for(var x=w-1;x>=1;x--){var v=val(x+"|"+d+"|main|"+i);if(v)return v;}return "";}
function mb(n){return (n/1048576).toFixed(n<10485760?1:0)+" MB";}

function unit(){return profile.unit==="kg"?"kg":"lb";}
var LIFTS=[["squat","Squat"],["bench","Bench"],["deadlift","Deadlift"]];
/* Meet attempts in kg: the lifter's own, or ~90/95/100% of their max. */
function meetAttempts(k){var mt=(profile.meet||{})[k];if(mt&&mt.length===3)return mt.slice();
 var m=(profile.maxes||{})[k];return m?Plates.attempts(Plates.toKg(m,unit())):null;}
function renderMeet(){var h='',tot=0,ok=true;
 h+='<section class="card"><div class="head"><div><h2>Meet day</h2><p class="sub">Attempts in kg, the way the meet runs them. They start at about 90%, 95% and 100% of your maxes. Change any attempt to match your coach\'s plan.</p></div></div>';
 LIFTS.forEach(function(x){var a=meetAttempts(x[0]);
  h+='<div class="ex"><div class="nm"><span>'+x[1]+'</span><small>'+(a?"":"add your max first")+'</small></div>';
  if(!a){ok=false;h+='</div>';return;}
  tot+=a[2];
  var pick=ui.att[x[0]]||0;
  h+='<div class="sets">';a.forEach(function(v,i){h+='<div class="set"><label for="at-'+x[0]+i+'">'+["Opener","Second","Third"][i]+'</label><input class="w" id="at-'+x[0]+i+'" data-att="'+x[0]+'" data-i="'+i+'" inputmode="decimal" value="'+Plates.fmt(v)+'"></div>';});
  h+='</div><div class="vrow" role="group" aria-label="Show bar for" style="margin-top:8px">';
  a.forEach(function(v,i){h+='<button class="mini'+(i===pick?' primary':'')+'" data-show="'+x[0]+'" data-i="'+i+'">'+["Opener","Second","Third"][i]+'</button>';});
  h+='</div><div id="mbar-'+x[0]+'">'+Plates.barSVG(a[pick])+'</div></div>';});
 var d=ok&&profile.bw?Plates.dots(tot,Plates.toKg(profile.bw,unit()),profile.sex):null;
 h+='<div class="kv" style="margin-top:12px"><div><b>'+(ok?Plates.fmt(tot)+" kg":"–")+'</b><span>total if every third is good</span></div><div><b>'+(d?Plates.fmt(Math.round(d*10)/10):"–")+'</b><span>suggested DOTS</span></div></div>';
 if(ok&&!profile.bw)h+='<p class="sub" style="margin-top:8px">Add your bodyweight under My maxes to see your DOTS score.</p>';
 h+='<div class="actions" style="margin-top:12px"><button class="btn primary" id="meet-save">Save attempts</button></div></section>';
 return h;}
function maxesCard(){var m=profile.maxes||{},U=unit(),has=m.squat||m.bench||m.deadlift;
 var sum=has?"S "+(m.squat||"–")+" · B "+(m.bench||"–")+" · D "+(m.deadlift||"–")+" "+U:"Add your maxes to get suggested weights";
 var h='<section class="card"><details'+(has?'':' open')+'><summary>My maxes: '+esc(sum)+'</summary>';
 h+='<p class="sub" style="margin:6px 0 10px">Your best single for each lift. The tracker multiplies these by your coach\'s percentages and rounds to weights you can load. Bands are added on top.</p><div class="vrow">';
 [["squat","Squat"],["bench","Bench"],["deadlift","Deadlift"]].forEach(function(x){h+='<label class="sub" for="mx-'+x[0]+'" style="flex:1 1 90px">'+x[1]+'<input class="w" id="mx-'+x[0]+'" inputmode="decimal" value="'+esc(m[x[0]]||"")+'" style="margin-top:4px"></label>';});
 h+='</div><div class="vrow" style="margin-top:8px"><label class="sub" for="mx-bw" style="flex:1 1 90px">Bodyweight<input class="w" id="mx-bw" inputmode="decimal" value="'+esc(profile.bw||"")+'" style="margin-top:4px"></label>';
 h+='<label class="sub" for="mx-sex" style="flex:1 1 120px">DOTS formula<select id="mx-sex" style="margin-top:4px;height:44px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:600 16px var(--body)"><option value="F"'+(profile.sex!=="M"?" selected":"")+'>Women</option><option value="M"'+(profile.sex==="M"?" selected":"")+'>Men</option></select></label>';
 h+='<label class="sub" for="mx-unit" style="flex:0 0 80px">Unit<select id="mx-unit" style="margin-top:4px;height:44px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:600 16px var(--body)"><option value="lb"'+(U==="lb"?" selected":"")+'>lb</option><option value="kg"'+(U==="kg"?" selected":"")+'>kg</option></select></label></div>';
 h+='<div class="actions" style="margin-top:10px"><button class="btn" id="mx-save">Save maxes</button></div></details></section>';return h;}
function render(){
 var h='<header class="top"><div class="wrap"><div class="titlebar"><h1>'+esc(P.name)+'</h1><span class="status" id="status"></span></div>';
 h+='<div class="userbar"><span>'+esc(me.email)+'</span><span>'+(me.isCoach?'<a href="/coach">Coach dashboard</a> · ':'')+'<button id="signout">Sign out</button></span></div>';
 h+='<div class="weeks" role="group" aria-label="Week">';
 for(var w=1;w<=WEEKS;w++){var nd=DAYS.filter(function(d){return isDone(w+"|"+d.k);}).length;
  h+='<button class="wk'+(nd===DAYS.length?' full':'')+'" id="wk'+w+'" data-w="'+w+'" aria-pressed="'+(w===cur.w)+'" style="--pc:var(--line)" aria-label="Week '+w+', '+nd+' of '+DAYS.length+' days done">'+w+'<span class="dots" aria-hidden="true">';
  DAYS.forEach(function(d){h+='<i class="'+(isDone(w+"|"+d.k)?"on":"")+'"></i>';});h+='</span></button>';}
 h+='</div><button class="wk meetbtn" data-w="meet" aria-pressed="'+(cur.w==="meet")+'">🏆 Meet day</button>';
 if(cur.w==="meet"){h+='</div></header><div class="wrap"><main>'+maxesCard()+renderMeet()+'</main></div>';root.innerHTML=h;renderStatus();return;}
 h+='<div class="days" role="group" aria-label="Day">';
 DAYS.forEach(function(d){var dn=isDone(cur.w+"|"+d.k);
  h+='<button class="day" data-d="'+d.k+'" aria-pressed="'+(d.k===cur.d)+'">'+d.n.replace(" ","<br>")+'<span class="chk">'+(dn?"✓ done":"&nbsp;")+'</span></button>';});
 h+='</div>';
 if(B)h+='<div class="modebar"><label for="mode">Accessories</label><select id="mode"><option value="bodi"'+(cur.mode==="bodi"?" selected":"")+'>My version</option><option value="coach"'+(cur.mode==="coach"?" selected":"")+'>Coach\'s program</option></select></div>';
 h+='</div></header><div class="wrap"><main>';
 h+=maxesCard();
 var wn=(P.weeks[cur.w-1]||{}).notes;
 if(wn)h+='<div class="note"><b>Coach · Week '+cur.w+'</b><br>'+esc(wn)+'</div>';
 var lifts=dayOf(cur.w,cur.d).main||[];
 h+='<section class="card"><div class="head"><div><h2>Main lifts</h2><p class="sub">From your coach. Unchanged.</p></div></div>';
 if(!lifts.length)h+='<p class="empty">'+(lifts.length?"":"Nothing programmed for this day.")+'</p>';
 else{h+='<div class="lifts">';lifts.forEach(function(l,i){var k=cur.w+"|"+cur.d+"|main|"+i,id="m"+i;
  var meta=[l.bar,l.pct,l.bands].filter(Boolean).join(" · ");
  h+='<div class="lift"><div><div class="nm">'+esc(l.lift)+'</div><div class="meta">'+esc(meta)+'</div></div><div class="rx">'+esc(l.reps||"–")+'</div>';
  if(l.reps||l.pct){var sg=Plates.suggest(l,profile),U=unit();
   if(sg)h+='<div class="sugg"><span>Suggested <b>'+esc(Plates.fmt(sg.lo)+(sg.hi?"–"+Plates.fmt(sg.hi):"")+(sg.plus?"+":"")+" "+U)+'</b>'+(sg.bands?' + '+esc(sg.bands):'')+'</span></div>';
   h+='<div class="log"><label for="'+id+'">Weight used</label><input class="w" id="'+id+'" data-k="'+k+'" inputmode="decimal" value="'+esc(val(k))+'" placeholder="'+esc(prevMain(cur.w,cur.d,i))+'"><span class="unit">'+U+'</span></div>';
   h+=videoBlock(k,i,l.lift);}
  h+='</div>';});h+='</div>';}
 h+='</section>';
 var exs=exList(cur.w,cur.d),coach=cur.mode==="coach"||!B;
 h+='<section class="card"><div class="head"><div><h2>Accessories</h2><p class="sub">'+(coach?"From your coach.":"Your swaps, matched to your coach\'s accessories.")+'</p></div></div>';
 if(!exs.length)h+='<p class="empty">No accessories listed for this day.</p>';
 exs.forEach(function(e,ei){var nm=e[0];h+='<div class="ex"><div class="nm"><span>'+esc(nm)+'</span><small>'+e[1].length+' sets</small></div><div class="sets">';
  e[1].forEach(function(r,si){var k=cur.w+"|"+cur.d+"|"+exKey(nm)+"|"+si,id="x"+ei+"s"+si;
   h+='<div class="set"><label for="'+id+'">'+esc(r)+'</label><input class="w" id="'+id+'" data-k="'+k+'" inputmode="decimal" value="'+esc(val(k))+'" placeholder="'+esc(prevVal(cur.w,cur.d,nm,si))+'" aria-label="'+esc(nm)+' set '+(si+1)+', '+esc(r)+' reps, weight in '+(unit()==="kg"?"kilograms":"pounds")+'"></div>';});
  h+='</div></div>';});
 if(!coach&&B.orig[cur.d])h+='<details><summary>What these replace</summary><p>'+esc(B.orig[cur.d])+'</p></details>';
 h+='</section>';
 var dn=isDone(cur.w+"|"+cur.d);
 h+='<div class="actions"><button class="btn" id="toggle-done">'+(dn?"Mark not done":"Mark day done")+'</button><button class="btn primary" id="save">Save workout</button></div>';
 h+='<p class="sub">Grey numbers are your last logged weight for that set. Your coach sees what you save.</p>';
 h+='</main></div>';
 root.innerHTML=h;renderStatus();
 var a=document.getElementById("wk"+cur.w),strip=root.querySelector(".weeks");if(a&&strip)strip.scrollLeft=Math.max(0,a.offsetLeft-strip.offsetLeft-(strip.clientWidth-a.offsetWidth)/2);
}
function renderStatus(){var el=document.getElementById("status"),b=document.getElementById("save");if(!el)return;
 if(ui.saving){el.textContent="Saving…";el.className="status";}
 else if(ui.saveErr){el.textContent=ui.saveErr;el.className="status dirty";}
 else if(dirty()){el.textContent="Unsaved changes";el.className="status dirty";}
 else{el.textContent="All saved";el.className="status";}
 if(b){b.disabled=ui.saving||!dirty();b.textContent=ui.saving?"Saving…":dirty()?"Save workout":"Saved";}}

/* ---------- videos ---------- */
function videoBlock(k,i,lift){var v=state.videos[k],h='<div class="vid" data-vk="'+esc(k)+'">';
 if(ui.busy[k])h+='<p class="vmsg" role="status">'+esc(ui.busy[k])+'</p>';
 else if(v&&v.path)h+='<div class="vrow"><span class="vok">✓ Video uploaded</span><span class="sub">'+esc(v.at||"")+'</span><label class="mini" for="vf'+i+'">Replace</label><button class="mini" data-vact="remove">Remove</button></div>';
 else h+='<div class="vrow"><label class="mini primary" for="vf'+i+'">🎥 Add video</label><span class="sub">Record or pick from your phone</span></div>';
 h+='<input class="sr" type="file" accept="video/*" id="vf'+i+'" data-vk="'+esc(k)+'">';
 if(ui.msg[k])h+='<p class="vmsg err" role="alert">'+esc(ui.msg[k])+'</p>';
 return h+'</div>';}
function handleFile(k,file){if(!file)return;delete ui.msg[k];
 var m=/\.([a-z0-9]+)$/i.exec(file.name||""),ext=(m?m[1]:"").toLowerCase();
 if(!ext){ext=/quicktime/.test(file.type)?"mov":/webm/.test(file.type)?"webm":"mp4";}
 if(["mp4","mov","webm","m4v"].indexOf(ext)<0){ui.msg[k]="Use an MP4 or MOV video.";render();return;}
 var old=state.videos[k];
 ui.busy[k]="Uploading "+mb(file.size)+"… keep this page open.";render();
 SDP.api("/api/upload-url",{method:"POST",body:JSON.stringify({key:k,ext:ext,size:file.size})})
 .then(function(r){return fetch(r.url,{method:"PUT",body:file}).then(function(res){if(!res.ok)throw new Error("The upload didn't go through ("+res.status+"). Try again.");return r;});})
 .then(function(r){var nv=Object.assign({},state.videos);nv[k]={path:r.path,size:file.size,at:new Date().toISOString().slice(0,10)};
  delete ui.busy[k];return save(nv);})
 .catch(function(e){delete ui.busy[k];ui.msg[k]=e.message||"The upload didn't go through. Try again.";render();});}

/* ---------- saving ---------- */
function merged(){var logs=Object.assign({},state.logs),done=Object.assign({},state.done);
 Object.keys(draft.logs).forEach(function(k){if(draft.logs[k])logs[k]=draft.logs[k];else delete logs[k];});
 Object.keys(draft.done).forEach(function(k){if(draft.done[k])done[k]=true;else delete done[k];});return {logs:logs,done:done};}
function save(nextVideos){var mm=merged(),videos=nextVideos||state.videos;
 ui.saving=true;ui.saveErr="";renderStatus();
 return SDP.api("/api/me",{method:"PUT",body:JSON.stringify({logs:mm.logs,done:mm.done,videos:videos,mode:cur.mode,profile:profile})})
 .then(function(){state.logs=mm.logs;state.done=mm.done;state.videos=videos;draft={logs:{},done:{}};saveDraft();ui.saving=false;render();})
 .catch(function(e){ui.saving=false;ui.saveErr=e.status===401?"Signed out. Reload to sign in.":"Couldn't save. Try again.";render();});}
function setHash(){if(cur.w==="meet"){try{history.replaceState(null,"","#meet");}catch(e){}return;}var h="w"+cur.w+"-"+cur.d.toLowerCase()+(cur.mode==="coach"?"-coach":"");try{history.replaceState(null,"","#"+h);}catch(e){}}

root.addEventListener("click",function(ev){var t=ev.target.closest("button");if(!t)return;
 if(t.dataset.vact==="remove"){var k=t.closest(".vid").dataset.vk;var nv=Object.assign({},state.videos);delete nv[k];save(nv);return;}
 if(t.id==="mx-save"){var mx={};["squat","bench","deadlift"].forEach(function(k3){var n=parseFloat(document.getElementById("mx-"+k3).value);if(n>0)mx[k3]=n;});
  var bw=parseFloat(document.getElementById("mx-bw").value);
  profile={unit:document.getElementById("mx-unit").value==="kg"?"kg":"lb",maxes:mx,bw:bw>0?bw:undefined,sex:document.getElementById("mx-sex").value,meet:profile.meet||{}};save();return;}
 if(t.dataset.show){ui.att[t.dataset.show]=+t.dataset.i;render();return;}
 if(t.id==="meet-save"){var meet={};LIFTS.forEach(function(x){var a=[0,1,2].map(function(i){var el=document.getElementById("at-"+x[0]+i);return el?parseFloat(el.value):NaN;});if(a.every(function(n){return n>0;}))meet[x[0]]=a;});
  profile=Object.assign({},profile,{meet:meet});save();return;}
 if(t.dataset.w){cur.w=t.dataset.w==="meet"?"meet":+t.dataset.w;setHash();render();window.scrollTo(0,0);}
 else if(t.dataset.d){cur.d=t.dataset.d;setHash();render();window.scrollTo(0,0);}
 else if(t.id==="toggle-done"){var k2=cur.w+"|"+cur.d;draft.done[k2]=!isDone(k2);if(!!draft.done[k2]===!!state.done[k2])delete draft.done[k2];saveDraft();render();}
 else if(t.id==="save"){save();}
 else if(t.id==="signout"){SDP.signOut();}
});
root.addEventListener("change",function(ev){var ft=ev.target;
 if(ft.type==="file"&&ft.dataset.vk){handleFile(ft.dataset.vk,ft.files&&ft.files[0]);return;}
 if(ft.id==="mode"){cur.mode=ft.value;setHash();render();}});
root.addEventListener("input",function(ev){var t=ev.target;
 if(t.dataset&&t.dataset.att){var n=parseFloat(t.value),el=document.getElementById("mbar-"+t.dataset.att);
  if(el&&n>0&&(ui.att[t.dataset.att]||0)===+t.dataset.i)el.innerHTML=Plates.barSVG(n);
  var sb=document.getElementById("meet-save");if(sb)sb.textContent="Save attempts";return;}
 if(!t.dataset||!t.dataset.k)return;var k=t.dataset.k,v=t.value.trim();
 if(v===(state.logs[k]||""))delete draft.logs[k];else draft.logs[k]=v;saveDraft();renderStatus();});
window.addEventListener("beforeunload",function(e){if(dirty()){e.preventDefault();e.returnValue="";}});

function pickStart(){if(location.hash==="#meet"){cur.w="meet";return;}var m=/^#w(\d{1,2})-([a-z0-9_-]+?)(-coach|-bodi)?$/i.exec(location.hash||"");
 if(m&&m[3])cur.mode=m[3].slice(1);
 if(m&&+m[1]>=1&&+m[1]<=WEEKS&&DAYS.some(function(d){return d.k.toLowerCase()===m[2].toLowerCase();})){cur.w=+m[1];cur.d=DAYS.filter(function(d){return d.k.toLowerCase()===m[2].toLowerCase();})[0].k;return;}
 for(var w=1;w<=WEEKS;w++){if(!DAYS.every(function(d){return isDone(w+"|"+d.k);})){cur.w=w;break;}}
 var f=DAYS.filter(function(d){return !isDone(cur.w+"|"+d.k);})[0];cur.d=f?f.k:DAYS[0].k;}

SDP.start(document.getElementById("auth")).then(function(){
 root.innerHTML='<p class="loading">Loading your log…</p>';
 return Promise.all([SDP.api("/api/program"),SDP.api("/api/me")]);
}).then(function(res){P=res[0].program;B=res[0].bodi;Plates.configure(res[0].plates);DAYS=P.days;WEEKS=P.weeks.length;me=res[1].user;var d=res[1].data||{};profile=res[1].profile&&res[1].profile.unit?res[1].profile:{unit:"lb",maxes:(res[1].profile||{}).maxes||{}};
 document.title=P.name+" Tracker";if(!B)cur.mode="coach";
 state={logs:d.logs||{},done:d.done||{},videos:d.videos||{}};if(d.mode&&B)cur.mode=d.mode;
 loadDraft();pickStart();render();
}).catch(function(e){root.innerHTML='<p class="loading err">'+esc(e.message||"Something went wrong. Reload to try again.")+'</p>';});
})();
</script>
</body>
</html>
